services:
  backend:
    build: ./backend
    container_name: skstore-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app        
      - /app/node_modules    
    networks:
      - skstore-net

  frontend:
    build: ./frontend
    container_name: skstore-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_PROXY_TARGET=http://backend:8000
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app       
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - skstore-net

networks:
  skstore-net:
    driver: bridge